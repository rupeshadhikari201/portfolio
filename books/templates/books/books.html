{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container my-5">
    <h2 class="text-center mb-4" style="font-family: 'Poppins', sans-serif;">Books List</h2>
    <div class="row g-4">
        {% for book in books %}
        <div class="col-12 col-sm-6 col-md-4 mb-5">
            <div class="card h-100">
                {% if book.cover_image %}
                <img src="{{ book.cover_image.url }}" class="card-img-top" alt="{{ book.title }}"
                    style="height: 300px; object-fit: cover;">
                {% else %}
                <img src="{% static 'default_cover.jpg' %}" class="card-img-top" alt="{{ book.title }}"
                    style="height: 300px; object-fit: cover;">
                {% endif %}
                <!-- Optional book details -->
                <div class="card-body">
                    <h5 class="card-title">{{ book.title }}</h5>
                    <p class="card-text"><strong>Author:</strong> {{ book.author }}</p>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
